project_id = "ifzmvwxtjeartovlppvo"

[auth]
enabled = true
# Where confirmation and recovery links send people back to. Update this to the
# deployed origin once the app has one, or password resets will bounce users to
# localhost.
site_url = "https://gharbaar.vercel.app"
additional_redirect_urls = ["https://gharbaar.vercel.app", "http://localhost:5173"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true

# Off deliberately.
#
# Supabase's built-in mailer allows only a couple of messages an hour on the
# free tier, and six people signing up the same evening hit a 429 that looks
# exactly like the app being broken. We saw it happen on the second test signup.
#
# Confirming an address was never what protects this data anyway. The six roster
# seats are: an account that has not claimed one can read its own profile row
# and nothing else. Turning this on again is only worth it behind custom SMTP.
enable_confirmations = false
secure_password_change = false

# Password recovery still sends mail even with confirmations off, so keep the
# throttle and the longer code. Both of these were pinned back after the first
# config push silently replaced them with CLI defaults.
max_frequency = "1m0s"
otp_length = 6

# Gmail, via an app password.
#
# The built-in mailer cannot do this job: free tier projects on the default
# provider are forbidden from editing email templates, and the default template
# contains a sign-in link rather than a code. Custom SMTP is what unlocks the
# template, and it also retires the two-emails-an-hour cap.
#
# Credentials come from the environment, never from this file. The repo is
# public, and an app password is a live credential for a Google account.
#
#   $env:SMTP_PASS='16 chars'; npx supabase config push
#
# The address is here rather than in an env var because it is already the author
# of every commit in this public repo. The app password is not, and never will
# be: an empty SMTP_PASS makes this push fail loudly rather than quietly
# clearing the credential.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "aryalsuwan.2003@gmail.com"
pass = "env(SMTP_PASS)"
admin_email = "aryalsuwan.2003@gmail.com"
sender_name = "Gharbaar"

# The mail that carries the code. The default template sends a magic link, and
# a link is the wrong shape here: people open the app on a phone and read the
# code off a laptop, or the other way round. A code works either way.
[auth.email.template.magic_link]
subject = "Your Gharbaar code"
content_path = "./supabase/templates/magic_link.html"

# Also restored rather than chosen. Nobody has enrolled a second factor, but
# switching the option off by leaving it out of a file is not a decision anyone
# made.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The reminder is called by pg_cron, which has no user and therefore no JWT.
# Supabase verifies one on every function by default and rejects the call before
# our code runs. Our own x-cron-secret is what authorises it, checked in the
# first four lines of the function, and the secret lives in Vault rather than in
# this repo.
[functions.cook-reminder]
verify_jwt = false
