<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gharbaar">
  <!--
    A house standing in water, seen from the side, with the waterline cutting
    across it. The gable is the household; the wave is the same caustic motion
    the whole app is built on, and the part of the house below the line reads
    as refracted rather than shaded, which is why it shifts hue instead of
    just darkening.

    Drawn on a 64 grid with the waterline at y=40, so the mark still resolves
    at 16px in a browser tab: at that size it is a roof over a ripple, which is
    the whole idea.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2030" />
      <stop offset="1" stop-color="#04101a" />
    </linearGradient>

    <linearGradient id="dry" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#9ff5df" />
      <stop offset="1" stop-color="#63e6c8" />
    </linearGradient>

    <linearGradient id="wet" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3ec9c4" />
      <stop offset="1" stop-color="#1c7f96" />
    </linearGradient>

    <!-- The house, used to clip both the waterline and the submerged half. -->
    <clipPath id="house">
      <path d="M32 8 L56 29.5 a2.4 2.4 0 0 1 -1.6 4.2 L52 33.7 L52 52 a3 3 0 0 1 -3 3 L15 55 a3 3 0 0 1 -3 -3 L12 33.7 L9.6 33.7 a2.4 2.4 0 0 1 -1.6 -4.2 Z" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ground)" />

  <g clip-path="url(#house)">
    <rect x="0" y="0" width="64" height="64" fill="url(#dry)" />
    <!-- Everything below the waterline, refracted. -->
    <path d="M0 40 q 8 -4.6 16 0 t 16 0 t 16 0 t 16 0 L64 64 L0 64 Z" fill="url(#wet)" />
  </g>

  <!-- The waterline itself, carried past the house on both sides so the
       building sits in the water rather than in front of it. -->
  <path
    d="M2 40 q 8 -4.6 16 0 t 16 0 t 16 0 t 16 0"
    fill="none"
    stroke="#63e6c8"
    stroke-width="2.1"
    stroke-linecap="round"
    opacity="0.85"
  />
</svg>
