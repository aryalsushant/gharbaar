<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04101a" />
    <meta name="description" content="Who paid, who cooks, who owes." />

    <!-- Standalone on iOS home screen, which is also the only way web push
         works there, so these are load-bearing rather than cosmetic. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gharbaar" />

    <link rel="icon" type="image/svg+xml" href="/mark.svg" />

    <!-- The first paint is the app's own dark, not the browser's white, and it
         happens before any stylesheet has arrived. -->
    <style>
      html,
      body {
        margin: 0;
        background: #04101a;
      }
    </style>

    <!-- Fonts load without holding up the first paint. A stylesheet in the
         head blocks rendering until it has arrived, and on an installed app
         that was a round trip to Google before anything could show. Loaded as
         print media the browser fetches it off the critical path, and the
         swap to screen media on load applies it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Martian+Mono:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <title>Gharbaar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
